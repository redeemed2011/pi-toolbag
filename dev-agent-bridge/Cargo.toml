[package]
name = "dev-agent-bridge"
version = "0.1.0"
edition = "2024"
description = "Messages between Sam's dev agents and Engineering Lead (bb-file's Grok Bot): send to its webhook, and take its messages from the shared inbox."
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
